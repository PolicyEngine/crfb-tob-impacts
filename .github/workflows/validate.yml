name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  python:
    name: Python Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          # Install the versions uv.lock pins, so new releases of ruff,
          # pandas or spm-calculator cannot break the guards. PyPI no longer
          # serves policyengine-us 1.729.0, which policyengine[us]==4.17.5
          # pins exactly, so skip that one package here and install the same
          # release from its version-bump commit on GitHub. The lock already
          # installs its dependencies at their locked versions.
          uv sync --frozen --python 3.13 --extra dev --no-install-package policyengine-us
          uv pip install --no-deps \
            "policyengine-us @ https://github.com/PolicyEngine/policyengine-us/archive/180410fe35209fb8201378c1b32dadd38051c342.tar.gz"

      - name: Ruff
        run: |
          .venv/bin/ruff check \
            scripts/build_release_package.py \
            src/reform_full_h5_output_manifest.py \
            tests/test_release_artifacts.py \
            tests/test_release_package.py

      - name: Pytest critical guards
        run: |
          .venv/bin/pytest -q \
            tests/test_release_artifacts.py \
            tests/test_dashboard_baseline_assumptions.py \
            tests/test_release_package.py \
            tests/test_results_contract.py \
            tests/test_published_data_integrity.py \
            tests/test_headline_summary.py \
            tests/test_behavioral_anchor_interpolation.py \
            tests/test_reforms.py

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
